<!DOCTYPE html>
<html lang="en">

{% include head.html %}

<body id="page-top" class="project-page">

  {% include nav.html %}

  <!-- Page hero banner -->
  <div class="project-hero">
    <div class="container">
      <div class="row">
        <div class="col-lg-10 col-lg-offset-1">
          <p class="project-back"><a href="{{ site.baseurl }}/">&larr; Back to Portfolio</a></p>
          <h1 class="project-title">{{ page.title }}</h1>
        </div>
      </div>
    </div>
  </div>

  <!-- Page body -->
  <section class="project-body">
    <div class="container">
      <div class="row">
        <div class="col-lg-8 col-lg-offset-2 project-content">
          {{ content }}
        </div>
      </div>
    </div>
  </section>

  {% include footer.html %}
  {% include scripts.html %}

</body>
</html>

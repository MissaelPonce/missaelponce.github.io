<section id="skills">
    <div class="container">
        <div class="row">
            <div class="col-lg-12 text-center reveal-on-scroll">
                <h2 class="section-heading">Skills</h2>
                <hr class="primary">
            </div>
        </div>
    </div>
    <div class="container">
        <div class="row">
            {% for group in site.data.skills.groups %}
            <div class="col-lg-3 col-md-6 text-center reveal-on-scroll" style="--reveal-delay: {{ forloop.index0 | times: 60 }}ms">
                <div class="service-box">
                    <i class="fa fa-4x {{ group.icon }} text-primary"></i>
                    <h3>{{ group.category }}</h3>
                    <ul class="skill-list">
                        {% for skill in group.skills %}
                        <li>{{ skill }}</li>
                        {% endfor %}
                    </ul>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>

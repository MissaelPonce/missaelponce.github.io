<footer>
    <div class="container text-center">
        <img src="{{ site.baseurl }}/{{ site.logo }}" alt="{{ site.title }}" class="footer-logo">
        <p class="footer-legal">
            <a href="{{ site.baseurl }}/terms/">Terms of Service</a>
            <span class="footer-divider">&middot;</span>
            <a href="{{ site.baseurl }}/privacy/">Privacy Policy</a>
        </p>
        <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }}. All rights reserved.</p>
    </div>
</footer>

<!-- Floating back-to-top button (shown after scrolling past the hero) -->
<button id="back-to-top" class="back-to-top" type="button" aria-label="Back to top">
    <i class="fa fa-chevron-up" aria-hidden="true"></i>
</button>

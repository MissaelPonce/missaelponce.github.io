<header>
    <!-- Hero background video — sequences header-video-1.mp4 -> header-video-2.mp4 -> repeat.
         JS only attaches a src if prefers-reduced-motion is not set (see js/hero-video.js).
         Static poster comes from the header's CSS background-image (see _base.scss). -->
    <video id="hero-video" class="hero-video" muted autoplay playsinline preload="auto" aria-hidden="true"
           data-src1="{{ site.baseurl }}/img/header/header-video-1.mp4"
           data-src2="{{ site.baseurl }}/img/header/header-video-2.mp4"></video>
    <div class="header-content">
        <div class="header-content-inner">
            <h1>{{ site.title }}</h1>
            <hr>
            <p>Game &amp; Multiplatform Developer<br>Live Operations &amp; Game Services</p>
        </div>
    </div>
</header>

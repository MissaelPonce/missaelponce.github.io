<section class="no-padding" id="portfolio">
    <div class="container-fluid">
        <div class="row">
            <div class="col-lg-12 text-center" style="padding: 60px 0 40px;">
                <h2 class="section-heading">Projects</h2>
                <hr class="primary" style="margin: 20px auto 0;">
            </div>
        </div>
    </div>
    <div class="container-fluid">
        <div class="row no-gutter">
            {% for project in site.data.projects %}
            <div class="col-lg-4 col-sm-6">
                <a href="{{ site.baseurl }}/projects/{{ project.slug }}/" class="portfolio-box reveal-on-scroll" style="--reveal-delay: {{ forloop.index0 | times: 80 }}ms">
                    <img src="{{ site.baseurl }}/{{ project.thumbnail }}" class="img-responsive" alt="{{ project.title }}">
                    <div class="portfolio-box-caption">
                        <div class="portfolio-box-caption-content">
                            <div class="project-category text-faded">
                                {{ project.category }}{% if project.status == "in-progress" %} &mdash; In Progress{% endif %}
                            </div>
                            <div class="project-name">
                                {{ project.title }}
                            </div>
                            <div class="project-tags">
                                {% for tag in project.tags limit:3 %}
                                <span class="tag">{{ tag }}</span>
                                {% endfor %}
                            </div>
                        </div>
                    </div>
                </a>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
